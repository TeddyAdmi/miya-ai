<style>
/* Custom aspect-ratio menus with crisp inline device icons. */
.ratio-device-select{position:relative;display:inline-flex;flex:0 1 auto;min-width:0;font:inherit}
.ratio-device-select>.ratio-device-trigger{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-width:76px;height:100%;min-height:31px;padding:5px 9px 5px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);font:700 12px/1 Inter,system-ui,sans-serif;white-space:nowrap}
.ratio-device-select .ratio-device-current{display:inline-flex;align-items:center;gap:8px;min-width:0}
.ratio-device-select .ratio-device-icon{display:block;width:19px;height:19px;flex:0 0 19px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.ratio-device-select .ratio-device-chevron{width:8px;height:8px;flex:0 0 8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.65}
.ratio-device-select .ratio-device-menu{position:absolute;z-index:10020;left:0;top:calc(100% + 7px);min-width:100%;width:max-content;padding:5px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 12px 32px rgba(0,0,0,.24);display:none}
.ratio-device-select.open .ratio-device-menu{display:grid;gap:2px}
.ratio-device-select .ratio-device-option{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:7px 10px;border-radius:8px;background:transparent;color:var(--text);font:600 12px/1.2 Inter,system-ui,sans-serif;text-align:left;white-space:nowrap}
.ratio-device-select .ratio-device-option:hover,.ratio-device-select .ratio-device-option[aria-selected="true"]{background:var(--surface2)}
.ratio-device-select .ratio-device-option[aria-selected="true"]{color:var(--purple)}
.ratio-device-select .ratio-device-native{display:none!important}
body.light .ratio-device-select .ratio-device-menu{box-shadow:0 12px 32px rgba(25,42,65,.14)}
@media(max-width:800px){.ratio-device-select>.ratio-device-trigger{gap:6px;padding-left:8px;padding-right:7px}.ratio-device-select .ratio-device-current{gap:6px}.ratio-device-select .ratio-device-icon{width:17px;height:17px;flex-basis:17px}}
</style>
<script>
(function(){
 const shapes={
  "16:9":'<svg class="ratio-device-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.7" y="3.2" width="18.6" height="13.1" rx="2.2"/><path d="M12 16.5v3.2M8.2 20h7.6"/></svg>',
  "9:16":'<svg class="ratio-device-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.3" y="1.8" width="11.4" height="20.4" rx="3"/><path d="M10.2 4.3h3.6M10.5 19.1h3"/></svg>',
  "1:1":'<svg class="ratio-device-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.1" y="3.1" width="17.8" height="17.8" rx="3"/></svg>'
 };
 const labels={"16:9":"16:9","9:16":"9:16","1:1":"1:1",auto:"auto"};
 function setup(select){
  if(!select||select.dataset.ratioDeviceReady)return;
  select.dataset.ratioDeviceReady="1";
  const wrap=document.createElement("div");wrap.className="ratio-device-select";
  const trigger=document.createElement("button");trigger.type="button";trigger.className="ratio-device-trigger";trigger.setAttribute("aria-haspopup","listbox");trigger.setAttribute("aria-expanded","false");trigger.setAttribute("aria-label",select.getAttribute("aria-label")||"Соотношение сторон");
  const current=document.createElement("span");current.className="ratio-device-current";
  const menu=document.createElement("div");menu.className="ratio-device-menu";menu.setAttribute("role","listbox");
  function paint(){
   const value=select.value;
   current.innerHTML=(shapes[value]||"")+ '<span>'+ (labels[value]||value) +'</span>';
   trigger.setAttribute("aria-label",(select.getAttribute("aria-label")||"Соотношение сторон")+": "+(labels[value]||value));
   [...menu.querySelectorAll("button")].forEach(b=>b.setAttribute("aria-selected",String(b.dataset.value===value)));
  }
  trigger.append(current);
  const chevron=document.createElement("span");chevron.className="ratio-device-chevron";trigger.append(chevron);
  [...select.options].forEach(option=>{
   const item=document.createElement("button");item.type="button";item.className="ratio-device-option";item.dataset.value=option.value;item.setAttribute("role","option");
   item.innerHTML=(shapes[option.value]||"")+ '<span>'+ (labels[option.value]||option.textContent.trim()) +'</span>';
   item.addEventListener("click",()=>{
    select.value=option.value;select.dispatchEvent(new Event("change",{bubbles:true}));paint();wrap.classList.remove("open");trigger.setAttribute("aria-expanded","false");trigger.focus();
   });
   menu.append(item);
  });
  trigger.addEventListener("click",()=>{
   const opening=!wrap.classList.contains("open");
   document.querySelectorAll(".ratio-device-select.open").forEach(w=>{w.classList.remove("open");w.querySelector(".ratio-device-trigger")?.setAttribute("aria-expanded","false")});
   if(opening){wrap.classList.add("open");trigger.setAttribute("aria-expanded","true")}
  });
  select.addEventListener("change",paint);
  select.classList.add("ratio-device-native");
  select.parentNode.insertBefore(wrap,select);wrap.append(trigger,menu);
  paint();
 }
 function init(){setup(document.getElementById("composerRatio"));setup(document.getElementById("videoRatio"))}
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init,{once:true});else init();
 document.addEventListener("click",event=>{if(!event.target.closest(".ratio-device-select"))document.querySelectorAll(".ratio-device-select.open").forEach(w=>{w.classList.remove("open");w.querySelector(".ratio-device-trigger")?.setAttribute("aria-expanded","false")})});
 document.addEventListener("keydown",event=>{if(event.key==="Escape")document.querySelectorAll(".ratio-device-select.open").forEach(w=>{w.classList.remove("open");w.querySelector(".ratio-device-trigger")?.setAttribute("aria-expanded","false");w.querySelector(".ratio-device-trigger")?.focus()})});
})();
