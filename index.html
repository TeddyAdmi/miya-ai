<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061426">
<meta name="description" content="Miya — AI Chat, images and video creation">
<title>Miya — AI Creative Studio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/b_manifest.json">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app-shell">
  <main class="main">
    <aside class="sidebar">
      <div class="side-brand">
        <span class="side-logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <defs><linearGradient id="brandG" x1="9" y1="10" x2="55" y2="54"><stop stop-color="#d987ff"/><stop offset=".48" stop-color="#9d68ff"/><stop offset="1" stop-color="#6258ff"/></linearGradient></defs>
            <path d="M32 4 40 24 60 32 40 40 32 60 24 40 4 32 24 24 32 4Z" fill="url(#brandG)"/>
            <path d="m32 15 4.8 12.2L49 32l-12.2 4.8L32 49l-4.8-12.2L15 32l12.2-4.8L32 15Z" fill="#fff" opacity=".96"/>
            <path d="m32 22 2.8 7.2L42 32l-7.2 2.8L32 42l-2.8-7.2L22 32l7.2-2.8L32 22Z" fill="#9c63ff"/>
          </svg>
        </span>
        <div><b>Miya</b></div>
      </div>

      <div class="side-label">РАЗДЕЛЫ</div>
      <button class="side-btn active" data-mode="chat"><span class="ico">◉</span><b>AI Chat</b><em>⌘</em></button>
      <button class="side-btn" data-mode="images"><span class="ico">▧</span><b>Картинки</b><em>1</em></button>
      <button class="side-btn" data-mode="video"><span class="ico">▶</span><b>Видео</b><em>2</em></button>

      <div class="side-label tools-label">ИНСТРУМЕНТЫ</div>
      <button class="tool-btn" data-tool="upload"><span>＋</span>Загрузить изображение</button>
      <button class="tool-btn" data-tool="improve"><span>✦</span>Улучшить промпт</button>
      <button class="tool-btn" data-tool="history"><span>◷</span>История</button>
      <button class="tool-btn" data-tool="library"><span>▱</span>Библиотека</button>

      <div class="sidebar-spacer"></div>
      <div class="system-card">
        <div class="system-title"><span class="live-dot"></span>Система онлайн</div>
        <div class="system-row"><span>Изображения</span><b>Готово</b></div>
        <div class="system-row"><span>Видео</span><b>Готово</b></div>
      </div>
      <button class="side-user" id="profileButton"><span>M</span><div><b>Miya User</b><small>0 PKOIN</small></div><i>⋯</i></button>
    </aside>

    <section class="workspace" id="workspace">
      <div class="workspace-head">
        <div class="workspace-copy">
          <div class="eyebrow" id="workspaceEyebrow">AI CHAT · MIYA</div>
          <h1 id="workspaceTitle">Твоя AI-комната</h1>
          <p id="workspaceSubtitle">Общайся с Miya, придумывай идеи и управляй созданием контента.</p>
        </div>
      </div>
      <div class="canvas" id="canvas"></div>
    </section>
  </main>

  <button class="floating-theme" id="themeToggle" title="Тема" aria-label="Переключить тему">☼</button>

  <section class="composer-wrap">
    <div class="composer" id="composer">
      <div class="composer-input-row">
        <button class="attach" id="composerAttach" title="Добавить изображение">＋</button>
        <textarea id="composerInput" rows="1" maxlength="4000" placeholder="Напиши сообщение..."></textarea>
        <button class="mic" id="composerMic" title="Голосовой ввод">⌕</button>
        <button class="send" id="composerSend"><span>✦</span><span id="composerSendText">Отправить</span></button>
      </div>
      <div class="composer-options image-settings" id="composerOptions">
        <select class="select-pill" id="composerModel" aria-label="Модель">
          <option>FLUX Dev</option>
          <option>FLUX Kontext Dev</option>
        </select>
        <select class="select-pill" id="composerSize" aria-label="Размер">
          <option>1024 × 1024</option>
          <option>1024 × 1536</option>
          <option>1536 × 1024</option>
          <option>1536 × 1536</option>
        </select>
        <select class="select-pill" id="composerQuality" aria-label="Качество">
          <option>Standard</option><option>High</option><option>Ultra</option>
        </select>
        <span class="composer-spacer"></span>
        <button class="improve" id="improve">✦ Улучшить промпт</button>
      </div>
      <div class="video-options" id="videoOptions">
        <select class="select-pill" id="videoModel"><option>LTX 2.3</option><option>LTX 2.5 Free</option></select>
        <select class="select-pill" id="videoDuration"><option>5 сек</option><option>8 сек</option><option>10 сек</option></select>
        <select class="select-pill" id="videoRatio"><option>16:9</option><option>9:16</option><option>1:1</option></select>
        <button class="pill active-pill" id="audioToggle">Audio</button>
      </div>
      <div class="composer-status"><span class="status-dot"></span><span id="composerStatus">AI Chat готов</span><span class="status-right">Enter — отправить · Shift + Enter — новая строка</span></div>
    </div>
  </section>

  <input id="referenceInput" type="file" accept="image/*" hidden>
  <nav class="mobile-tabs">
    <button class="active" data-mode="chat">◉<small>AI Chat</small></button>
    <button data-mode="images">▧<small>Картинки</small></button>
    <button data-mode="video">▶<small>Видео</small></button>
  </nav>
</div>
<script type="module" src="/src/app.js"></script>
</body>
</html>
