<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061426">
<meta name="description" content="Miya — AI Chat, images and video creation">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<title>Miya — AI Creative Studio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/b_manifest.json">
<link rel="stylesheet" href="/styles.css">
<!-- prompt-controls-sync -->
</head>
<body>
<div class="app-shell">
  <main class="main">
    <aside class="sidebar">
      <div class="side-brand">
        <span class="side-logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <defs><linearGradient id="brandG" x1="9" y1="10" x2="55" y2="54"><stop stop-color="#d987ff"/><stop offset=".48" stop-color="#9d68ff"/><stop offset="1" stop-color="#6258ff"/></linearGradient></defs>
            <path d="M32 4 40 24 60 32 40 40 32 60 24 40 4 32 24 24 32 4Z" fill="url(#brandG)"/>
            <path d="m32 15 4.8 12.2L49 32l-12.2 4.8L32 49l-4.8-12.2L15 32l12.2-4.8L32 15Z" fill="#fff" opacity=".96"/>
            <path d="m32 22 2.8 7.2L42 32l-7.2 2.8L32 42l-2.8-7.2L22 32l7.2-2.8L32 22Z" fill="#9c63ff"/>
          </svg>
        </span>
        <div><b>Miya AI Studio</b></div>
      </div>

      <div class="side-label">РАЗДЕЛЫ</div>
      <div class="chat-nav-wrap" id="chatNavWrap">
        <button class="side-btn side-menu-toggle" id="chatMenuToggle" type="button" aria-expanded="false">
          <span class="ico icon-chat" aria-hidden="true"></span><b>AI Chat</b><em id="chatMenuArrow">→</em>
        </button>
        <div class="side-submenu" id="chatSubmenu">
          <button class="side-subbtn" id="newChatBtn" type="button"><span>＋</span><b>Новый чат</b></button>
          <div class="chat-history-mini" id="chatHistoryMini"></div>
        </div>
      </div>

      <button class="side-btn" data-mode="images" type="button"><span class="ico icon-image" aria-hidden="true"></span><b>Картинки</b></button>
      <button class="side-btn" data-mode="video" type="button"><span class="ico icon-video" aria-hidden="true"></span><b>Видео</b></button>

      <div class="side-label tools-label">ИНСТРУМЕНТЫ</div>
      <button class="tool-btn" data-tool="improve"><span class="nav-icon icon-spark" aria-hidden="true"></span>Улучшить промпт</button>
      <button class="tool-btn" data-tool="history"><span class="nav-icon icon-history" aria-hidden="true"></span>История</button>
      <button class="tool-btn" data-tool="library"><span class="nav-icon icon-library" aria-hidden="true"></span>Библиотека</button>

      <div class="sidebar-spacer"></div>
      <button class="side-user" id="profileButton"><span class="profile-icon" aria-hidden="true">M</span><div><b>Miya User</b><small>0 PKOIN</small></div><i class="icon-more" aria-hidden="true"></i></button>
    </aside>

    <section class="workspace" id="workspace">
      <div class="workspace-head">
        <div class="workspace-copy">
          <div class="eyebrow" id="workspaceEyebrow">AI CHAT · MIYA</div>
          <h1 id="workspaceTitle">Твоя AI-комната</h1>
          <p id="workspaceSubtitle">Общайся с Miya, придумывай идеи и управляй созданием контента.</p>
        </div>
      </div>
      <div class="canvas" id="canvas"></div>
    </section>
  </main>

  <button class="floating-theme" id="themeToggle" title="Тема" aria-label="Переключить тему"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button>

  <section class="composer-wrap">
    <div class="composer" id="composer">
      <div class="composer-input-row">
        <div class="composer-left-actions">
          <button class="attach" id="composerAttach" title="Добавить изображение">＋</button>
        </div>
        <div class="composer-attachment" id="composerAttachment" hidden>
          <img id="composerAttachmentImage" alt="Прикреплённое изображение">
          <button type="button" id="composerAttachmentRemove" title="Удалить изображение">×</button>
        </div>
        <textarea id="composerInput" rows="1" maxlength="4000" placeholder="Напиши сообщение..."></textarea>
        <button class="composer-emoji" id="composerEmoji" type="button" title="Смайлики и идеи" aria-label="Смайлики и идеи"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9 10h.01M15 10h.01M8.5 14c1.8 2 5.2 2 7 0"/></svg></button>
        <button class="mic" id="composerMic" type="button" title="Голосовой ввод" aria-label="Начать голосовой ввод">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5a3.5 3.5 0 0 0 3.5 3.5Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3M8 21h8"/></svg>
        </button>
        <div class="emoji-panel" id="emojiPanel" aria-label="Смайлики и идеи">
          <div class="emoji-row"><button type="button" data-emoji="😀">😀</button><button type="button" data-emoji="😂">😂</button><button type="button" data-emoji="😍">😍</button><button type="button" data-emoji="🤔">🤔</button><button type="button" data-emoji="🔥">🔥</button><button type="button" data-emoji="✨">✨</button><button type="button" data-emoji="❤️">❤️</button><button type="button" data-emoji="🚀">🚀</button></div>
          <div class="starter-row" id="starterRow"></div>
        </div>
        <button class="send" id="composerSend"><span class="send-icon icon-arrow-up" aria-hidden="true"></span><span id="composerSendText">Отправить</span></button>
      </div>
      <div class="composer-options image-settings" id="composerOptions">
        <select class="select-pill" id="composerModel" aria-label="Модель">
          <option>FLUX Dev</option>
          <option>FLUX Kontext Dev</option>
        </select>
        <select class="select-pill" id="composerRatio" aria-label="Соотношение сторон"><option>auto</option><option>16:9</option><option>9:16</option><option>1:1</option></select>
        <select class="select-pill" id="composerCount" aria-label="Количество"><option value="1">1</option><option value="2">2</option><option value="4">4</option></select>
        <button class="improve composer-trash" id="improve" type="button" title="Улучшить промпт" aria-label="Улучшить промпт">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 3-1.7 4.3L8 9l4.3 1.7L14 15l1.7-4.3L20 9l-4.3-1.7L14 3Z"/><path d="m6.5 13-.9 2.3L3 16.2l2.6.9.9 2.4.9-2.4 2.6-.9-2.6-.9L6.5 13Z"/><path d="m18.5 14-.6 1.6-1.7.6 1.7.6.6 1.7.6-1.7 1.7-.6-1.7-.6-.6-1.6Z"/></svg>
        </button>
        <button class="composer-copy" id="copyPrompt" type="button" title="Копировать промт" aria-label="Копировать промт"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg></button>
        <button class="composer-trash" id="composerTrash" type="button" title="Стереть промт" aria-label="Стереть промт">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>
        </button>
        <span class="composer-spacer"></span>
      </div>
      <div class="video-options" id="videoOptions">
        <select class="select-pill" id="videoModel"><option selected>LTX-2.3 Distilled</option><option>PixelSter Motion Synthesis</option></select>
        <select class="select-pill" id="videoDuration"><option>5 сек</option><option>8 сек</option><option>10 сек</option></select>
        <select class="select-pill" id="videoRatio"><option>auto</option><option>16:9</option><option>9:16</option><option>1:1</option></select>
        <button class="improve composer-trash video-tool" id="videoImprove" type="button" title="Улучшить промпт" aria-label="Улучшить промпт"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="M19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9L19 16Z"/></svg></button>
        <button class="composer-copy video-tool" id="videoCopyPrompt" type="button" title="Копировать промт" aria-label="Копировать промт"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg></button>
        
        
        <button class="composer-trash video-trash" id="videoTrash" type="button" title="Стереть промт" aria-label="Стереть промт"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></button>
      </div>
      <div class="composer-status"><span class="status-dot"></span><span id="composerStatus">AI Chat готов</span><span id="composerProgress" class="composer-progress" aria-live="polite"></span><span class="status-right">Enter — отправить · Shift + Enter — новая строка</span></div>
    </div>
  </section>

  <input id="referenceInput" type="file" accept="image/*" hidden>
  <nav class="mobile-tabs">
    <button class="active" data-mode="chat"><span class="nav-icon icon-chat" aria-hidden="true"></span><small>AI Chat</small></button>
    <button data-mode="images"><span class="nav-icon icon-image" aria-hidden="true"></span><small>Картинки</small></button>
    <button data-mode="video"><span class="nav-icon icon-video" aria-hidden="true"></span><small>Видео</small></button>
  </nav>
</div>
<script>window.puter={quiet:true};</script>
<script src="https://js.puter.com/v2/" defer></script>
<script type="module" src="/src/app.js"></script>
</body>
</html>
