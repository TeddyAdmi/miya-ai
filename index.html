<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061426">
<meta name="description" content="Miya — AI Chat, images and video creation">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<title>Miya — AI Creative Studio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/b_manifest.json">
<link rel="stylesheet" href="/styles.css">
<!-- prompt-controls-sync -->
</head>
<body>
<div class="app-shell">
  <main class="main">
    <aside class="sidebar">
      <div class="side-brand">
        <span class="side-logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <defs><linearGradient id="brandG" x1="9" y1="10" x2="55" y2="54"><stop stop-color="#d987ff"/><stop offset=".48" stop-color="#9d68ff"/><stop offset="1" stop-color="#6258ff"/></linearGradient></defs>
            <path d="M32 4 40 24 60 32 40 40 32 60 24 40 4 32 24 24 32 4Z" fill="url(#brandG)"/>
            <path d="m32 15 4.8 12.2L49 32l-12.2 4.8L32 49l-4.8-12.2L15 32l12.2-4.8L32 15Z" fill="#fff" opacity=".96"/>
            <path d="m32 22 2.8 7.2L42 32l-7.2 2.8L32 42l-2.8-7.2L22 32l7.2-2.8L32 22Z" fill="#9c63ff"/>
          </svg>
        </span>
        <div><b>Miya AI Studio</b></div>
      </div>

      <div class="chat-nav-wrap" id="chatNavWrap">
        <button class="side-btn side-menu-toggle" id="chatMenuToggle" type="button" aria-expanded="false">
          <span class="ico icon-chat" aria-hidden="true"></span><b>AI Chat</b><em id="chatMenuArrow">→</em>
        </button>
        <div class="side-submenu" id="chatSubmenu">
          <button class="side-subbtn" id="newChatBtn" type="button"><span>＋</span><b>Новый чат</b></button>
          <div class="chat-history-mini" id="chatHistoryMini"></div>
        </div>
      </div>

      <button class="side-btn" data-mode="images" type="button"><span class="ico icon-image" aria-hidden="true"></span><b>Картинки</b></button>
      <button class="side-btn" data-mode="video" type="button"><span class="ico icon-video" aria-hidden="true"></span><b>Видео</b></button>
      <button class="side-btn" data-mode="music" type="button"><span class="ico icon-music" aria-hidden="true"><svg class="miya-music-note-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span><b>Музыка</b></button>
      <button class="side-btn" data-mode="voice" type="button"><span class="ico icon-voice" aria-hidden="true"></span><b>Голос</b></button>

      <div class="side-label tools-label">ИНСТРУМЕНТЫ</div>
      <button class="tool-btn" data-tool="improve"><span class="nav-icon icon-spark" aria-hidden="true"></span>Улучшить промпт</button>
      <button class="tool-btn" data-tool="poems" type="button"><span class="nav-icon icon-spark" aria-hidden="true"></span>Стихи</button>
      <button class="tool-btn" data-tool="lyrics" type="button"><span class="nav-icon icon-music" aria-hidden="true"></span>Текст песни</button>
      <button class="tool-btn" data-tool="editor"><span class="nav-icon icon-sliders" aria-hidden="true" style="width:19px;height:19px;display:grid;place-items:center"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 4v16M12 4v16M18 4v16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="6" cy="9" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="15" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span>Аудиоредактор</button>
            <button class="tool-btn" data-tool="library"><span class="nav-icon icon-library" aria-hidden="true"></span>Мои файлы</button>

      <div class="sidebar-spacer"></div>
      <button class="side-user" id="profileButton"><span class="profile-icon" aria-hidden="true">M</span><div><b>Miya User</b><small>0 PKOIN</small></div><i class="icon-more" aria-hidden="true"></i></button>
    </aside>

    <section class="workspace" id="workspace">
      <div class="workspace-head">
        <div class="workspace-copy">
          <div class="eyebrow" id="workspaceEyebrow">AI CHAT · MIYA</div>
          <h1 id="workspaceTitle">Твоя AI-комната</h1>
          <p id="workspaceSubtitle">Общайся с Miya, придумывай идеи и управляй созданием контента.</p>
          <div class="active-chat-title" id="activeChatTitle" hidden></div>
        </div>
      </div>
      <div class="canvas chat-canvas" id="canvas"><div class="studio-room clean-canvas">
  <div class="chat-welcome section-welcome">
    <div class="mini-badge">MIYA CHAT</div>
    <h2>Общайся с Miya</h2>
    <p>Задавай вопросы, придумывай идеи, создавай промпты и работай с контентом.</p>
    <div class="hero-mark"><svg class="welcome-chat-symbol" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path d="M32 8C18.7 8 8 17.5 8 29.3c0 5.1 2 9.8 5.5 13.4L11 54l12.2-4.6c2.8.8 5.7 1.2 8.8 1.2 13.3 0 24-9.5 24-21.3S45.3 8 32 8Z" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="29" r="2.7" fill="currentColor"/><circle cx="32" cy="29" r="2.7" fill="currentColor"/><circle cx="42" cy="29" r="2.7" fill="currentColor"/></svg></div>
  </div>
</div></div>
    </section>
  </main>

  <button class="floating-wall-clear" id="clearImageWall" title="Очистить стену" aria-label="Очистить стену"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h10l-1-13M10 11v5M14 11v5"/></svg></button>
  <button class="floating-theme" id="themeToggle" title="Тема" aria-label="Переключить тему"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button>

  <section class="composer-wrap">
    <div class="composer mode-chat" id="composer">
      <div class="composer-input-row">
        <div class="composer-left-actions">
          <button class="attach" id="composerAttach" title="Добавить изображение">＋</button>
        </div>
        <div class="composer-attachment" id="composerAttachment" hidden>
          <img id="composerAttachmentImage" alt="Прикреплённое изображение">
          <button type="button" id="composerAttachmentRemove" title="Удалить изображение"><svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 2L8 8M8 2L2 8"/></svg></button>
        </div>
        <div class="chat-attachment-list" id="chatComposerAttachments" aria-label="Фотографии для анализа"></div>
      <div class="chat-options" id="chatOptions" aria-label="Действия с текстом сообщения">
        <button class="composer-copy" id="chatCopyPrompt" type="button" title="Копировать текст" aria-label="Копировать текст"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg></button>
        <button class="composer-paste" id="chatPastePrompt" type="button" title="Вставить" aria-label="Вставить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5h6a2 2 0 0 1 2 2V8H7V6.5a2 2 0 0 1 2-2Z"/><rect x="5" y="8" width="14" height="13" rx="2"/><path d="M9 12h6M9 16h4"/></svg></button>
        <button class="composer-trash" id="chatTrash" type="button" title="Очистить текст" aria-label="Очистить текст"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></button>
      </div>
        <textarea id="composerInput" class="prompt-chat" data-mode="chat" style="min-height:30px!important;height:30px!important" rows="1" maxlength="4000" placeholder="Напишите сообщение или задайте вопрос Miya…"></textarea>        <button class="mic" id="composerMic" type="button" title="Голосовой ввод" aria-label="Начать голосовой ввод">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5a3.5 3.5 0 0 0 3.5 3.5Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3M8 21h8"/></svg>
        </button>
        <button class="send" id="composerSend"><span class="send-icon icon-arrow-up" aria-hidden="true"></span><span id="composerSendText">Отправить</span></button>
      </div>
      <div class="composer-options image-settings" id="composerOptions">
        <select class="select-pill" id="composerModel" aria-label="Модель">
          <option value="Nano BananA">Nano BananA · T2I</option>
          <option value="ImageSmith">GPT Image 2.5 · T2I / I2I</option>
          <option value="Nano Banana">Nano Banana · T2I</option>
          <option value="Seedream">Seedream · T2I</option>
          <option value="Agnes Image 2.5 Flash">Agnes Image · T2I / I2I</option>
          <option value="Z-Image Turbo (ImageFree)">Z-Image Turbo · ImageFree · бесплатно</option>
          <option value="Qwen Image 2.1 · T2I">Qwen Image 2.1 · T2I</option>
          <option value="Kolors">Kolors · T2I</option>
          <option value="Flux 2 Dev · T2I">Flux 2 Dev · T2I</option>
          <option value="FLUX Dev">FLUX Dev · T2I</option>
          <option value="FLUX Kontext Dev">FLUX Kontext · I2I</option>
        </select>
        <select class="select-pill" id="composerRatio" aria-label="Соотношение сторон"><option value="auto">auto</option><option value="16:9" selected>16:9</option><option value="9:16">9:16</option><option value="1:1">1:1</option></select>
        <select class="select-pill" id="composerQuality" aria-label="Качество изображения"><option value="1K">1K · Быстро</option><option value="2K" selected>2K · Высокое</option><option value="4K">4K · Максимум</option></select>
        <button class="improve composer-trash" id="improve" type="button" title="Улучшить промпт" aria-label="Улучшить промпт">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="transform:translateY(1px)"><path d="m14 3-1.7 4.3L8 9l4.3 1.7L14 15l1.7-4.3L20 9l-4.3-1.7L14 3Z"/><path d="m6.5 13-.9 2.3L3 16.2l2.6.9.9 2.4.9-2.4 2.6-.9-2.6-.9L6.5 13Z"/><path d="m18.5 14-.6 1.6-1.7.6 1.7.6.6 1.7.6-1.7 1.7-.6-1.7-.6-.6-1.6Z"/></svg>
        </button>
        <button class="composer-copy" id="copyPrompt" type="button" title="Копировать текст" aria-label="Копировать текст"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg></button>
        <button class="composer-paste" id="imagePastePrompt" type="button" title="Вставить" aria-label="Вставить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5h6a2 2 0 0 1 2 2V8H7V6.5a2 2 0 0 1 2-2Z"/><rect x="5" y="8" width="14" height="13" rx="2"/><path d="M9 12h6M9 16h4"/></svg></button>
        <button class="composer-trash" id="composerTrash" type="button" title="Очистить текст" aria-label="Очистить текст">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>
        </button>
        <span class="composer-spacer"></span>
      </div>

      <div class="voice-options" id="voiceOptions">
        <select class="select-pill" id="voiceLanguage" aria-label="Язык"><option value="ru" selected>Русский</option><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option></select>
        <select class="select-pill" id="voiceGender" aria-label="Пол"><option value="female" selected>Женский</option><option value="male">Мужской</option></select>
        <select class="select-pill" id="voiceSelect" aria-label="Голос"><option value="">Загрузка голосов…</option></select>
        <label class="voice-range"><span>Скорость</span><input id="voiceRate" type="range" min="-50" max="50" value="0"><b id="voiceRateValue">0</b></label>
        <label class="voice-range"><span>Pitch</span><input id="voicePitch" type="range" min="-50" max="50" value="0"><b id="voicePitchValue">0</b></label>
        <button class="composer-copy voice-tool" id="voiceCopyPrompt" type="button" title="Копировать текст" aria-label="Копировать текст"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg></button>
        <button class="composer-paste voice-tool" id="voicePastePrompt" type="button" title="Вставить" aria-label="Вставить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5h6a2 2 0 0 1 2 2V8H7V6.5a2 2 0 0 1 2-2Z"/><rect x="5" y="8" width="14" height="13" rx="2"/><path d="M9 12h6M9 16h4"/></svg></button>
        <button class="composer-trash voice-tool" id="voiceTrash" type="button" title="Очистить текст" aria-label="Очистить текст"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l-1-13M10 11v5M14 11v5"/></svg></button>
      </div>
      <div class="video-options" id="videoOptions">
        <select class="select-pill" id="videoModel"><option selected>OmegaTech T2V</option><option>NovAI CogVideoX-Flash</option><option>Agnes Video 2.5 Flash</option><option>Agnes Video v2.0</option><option>LTX-2.3 Distilled</option></select>
        <select class="select-pill" id="videoDuration"><option>4 сек</option><option selected>5 сек</option><option>6 сек</option><option>8 сек</option><option>10 сек</option><option>12 сек</option></select>
        <select class="select-pill" id="videoRatio" aria-label="Соотношение сторон видео"><option value="16:9" selected>16:9</option><option value="9:16">9:16</option><option value="1:1">1:1</option></select>
        <button class="improve video-tool" id="videoImprove" type="button" title="Улучшить промпт" aria-label="Улучшить промпт"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="M19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9L19 16Z"/></svg></button>
        <button class="composer-copy video-tool" id="videoCopyPrompt" type="button" title="Копировать текст" aria-label="Копировать текст"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg></button>
        <button class="composer-paste video-tool" id="videoPastePrompt" type="button" title="Вставить" aria-label="Вставить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5h6a2 2 0 0 1 2 2V8H7V6.5a2 2 0 0 1 2-2Z"/><rect x="5" y="8" width="14" height="13" rx="2"/><path d="M9 12h6M9 16h4"/></svg></button>
        
        
        <button class="composer-trash video-trash" id="videoTrash" type="button" title="Очистить текст" aria-label="Очистить текст"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></button>
      </div>
      <div class="composer-status"><span class="status-dot"></span><span id="composerStatus">AI Chat готов</span><span class="status-right">Enter — отправить · Shift + Enter — новая строка</span></div>
    </div>
  </section>

  <input id="referenceInput" type="file" accept="image/*" multiple hidden>
  <nav class="mobile-tabs">
    <button class="active" data-mode="chat"><span class="nav-icon icon-chat" aria-hidden="true"></span><small>AI Chat</small></button>
    <button data-mode="images"><span class="nav-icon icon-image" aria-hidden="true"></span><small>Картинки</small></button>
    <button data-mode="video"><span class="nav-icon icon-video" aria-hidden="true"></span><small>Видео</small></button>
    <button data-mode="music"><span class="nav-icon icon-music" aria-hidden="true"><svg class="miya-music-note-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span><small>Музыка</small></button>
    <button data-mode="voice"><span class="nav-icon icon-voice" aria-hidden="true"></span><small>Голос</small></button>
  </nav>
</div>
<style>
/* Light theme: unify ordinary text and interface icons to the same deep near-black.
   Preserve intentional semantic/brand states such as primary buttons, active selections and recording. */
body.light{--text:#111111!important;--muted:#111111!important}
body.light .side-btn:not(.active),
body.light .tool-btn,
body.light .side-label,
body.light .side-subbtn:not(.active),
body.light .chat-history-mini-item:not(.active),
body.light .composer textarea,
body.light .composer textarea::placeholder,
body.light .select-pill,
body.light .pill,
body.light .composer-copy,
body.light .composer-paste,
body.light .composer-trash,
body.light .improve,
body.light .attach,
body.light .mic:not(.recording),
body.light .nav-icon,
body.light .ico,
body.light .chat-quick-actions button,
body.light .library-tab:not(.active),
body.light .media-action,
body.light .media-prompt-copy,
body.light .media-prompt-close,
body.light .chat-actions button,
body.light .mobile-tabs button:not(.active),
body.light .chat-history-actions button,
body.light .chat-history-menu button,
body.light .composer-clear{color:#111111!important}
body.light .composer-copy svg,
body.light .composer-paste svg,
body.light .composer-trash svg,
body.light .improve svg,
body.light .attach svg,
body.light .mic:not(.recording) svg,
body.light .nav-icon svg,
body.light .ico svg,
body.light .media-action svg,
body.light .media-prompt-copy svg,
body.light .media-prompt-close svg,
body.light .chat-history-actions svg,
body.light .chat-history-menu svg{color:currentColor!important;stroke:currentColor}
body.light .composer textarea::placeholder{opacity:1!important;color:#111111!important;-webkit-text-fill-color:#111111!important}
/* Popup colors are shared by all composer dropdowns; the six closed controls are normalized below. */
body.light .miya-composer-select-popup,
body.light .miya-composer-select-option,
body.light .miya-composer-select-option .miya-ratio-label{color:#111111!important}
body.light .miya-composer-select-option[aria-selected="true"],
body.light .miya-composer-select-option:hover,
body.light .miya-composer-select-option.is-active,
body.light .miya-composer-select-option:focus-visible{color:#111111!important}
body.light .side-btn.active,
body.light .side-btn.active .ico,
body.light .side-btn.active .nav-icon,
body.light .mobile-tabs button.active,
body.light .library-tab.active{color:#111111!important}

/* Final ratio-menu normalization: stable text/icon columns and one text color in light mode. */
.miya-composer-select-popup .miya-composer-select-option.miya-ratio-option{
 color:inherit!important;
}
body.light .miya-composer-select-popup .miya-composer-select-option.miya-ratio-option,
body.light .miya-composer-select-popup .miya-composer-select-option.miya-ratio-option .miya-ratio-label{
 color:#111111!important;
}
body.light .miya-composer-select-popup .miya-composer-select-option.miya-ratio-option[aria-selected="true"],
body.light .miya-composer-select-popup .miya-composer-select-option.miya-ratio-option:hover,
body.light .miya-composer-select-popup .miya-composer-select-option.miya-ratio-option.is-active,
body.light .miya-composer-select-popup .miya-composer-select-option.miya-ratio-option:focus-visible{
 color:#111111!important;
}


/* Ratio pictograms keep their own vivid palette in both themes. */
#composerRatio.select-pill,#videoRatio.select-pill{padding-right:18px!important;}

/* Preserve the established compact footprint of the two aspect-ratio triggers. */
#composerRatio.select-pill,#videoRatio.select-pill{
  width:90px!important;min-width:90px!important;max-width:90px!important;
  flex:0 0 90px!important;box-sizing:border-box!important;
  padding-left:10px!important;padding-right:18px!important;
}
/* Canonical prompt controls for Images and Video. Keep the six selectors visually identical in both themes. */
#composer.mode-images #composerModel.select-pill,
#composer.mode-images #composerRatio.select-pill,
#composer.mode-images #composerQuality.select-pill,
#composer.mode-video #videoModel.select-pill,
#composer.mode-video #videoDuration.select-pill,
#composer.mode-video #videoRatio.select-pill{
  box-sizing:border-box!important;
  font-family:Inter,system-ui,sans-serif!important;
  font-size:12px!important;
  font-weight:700!important;
  line-height:16px!important;
  color:#a9bad0!important;
  -webkit-text-fill-color:#a9bad0!important;
  background-color:#0b223b!important;
  border-color:#1a4b78!important;
}
#composer.mode-images #composerModel.select-pill,
#composer.mode-images #composerQuality.select-pill,

  popup.style.width=width+"px";
  popup.style.left=Math.max(8,Math.min(left,window.innerWidth-width-8))+"px";
  // Fit all model options when possible; only scroll on unusually short viewports.
  const desiredHeight=popup.scrollHeight;
  popup.style.maxHeight=Math.max(80,Math.min(desiredHeight,window.innerHeight-16))+"px";
  const popupHeight=Math.min(desiredHeight,window.innerHeight-16);
  const popupAnchor=controlRect||oldLogoRect||selectRect;
  const below=window.innerHeight-popupAnchor.bottom-8;
  const above=popupAnchor.top-8;
  let top;
  if(below<Math.min(popupHeight,180)&&above>below)top=Math.max(8,popupAnchor.top-popupHeight-4);
  else top=Math.min(window.innerHeight-popupHeight-8,popupAnchor.bottom+4);
  popup.style.top=Math.max(8,top)+"px";
 }
 function openPopup(select,initialIndex){
  if(!select||!belongsToActiveSection(select))return;
  if(activeSelect&&activeSelect!==select)activeSelect.setAttribute("aria-expanded","false");
  activeSelect=select;
  const options=availableOptions(select);
  popup.replaceChildren();
  activeIndex=Number.isInteger(initialIndex)?initialIndex:options.findIndex(option=>option.value===select.value);
  if(activeIndex<0)activeIndex=0;
  options.forEach((option,index)=>{
   const item=document.createElement("button");
   item.type="button";
   item.className="miya-composer-select-option";
   item.setAttribute("role","option");
   item.setAttribute("aria-selected",String(option.value===select.value));
   item.dataset.value=option.value;
   item.dataset.index=String(index);
   if((select.id==="composerRatio"||select.id==="videoRatio")&&(ratioValues.has(option.value)||option.value==="auto")){item.classList.add("miya-ratio-option");const label=document.createElement("span");label.className="miya-ratio-label";label.textContent=option.value;const icon=document.createElement("span");icon.className="miya-ratio-icon";if(ratioValues.has(option.value))icon.innerHTML=ratioSvg(option.value);item.append(label,icon);item.setAttribute("aria-label",option.value);}else if(select.id==="composerModel"){
    item.classList.add("miya-model-option");
    const img=document.createElement("img");img.className="miya-model-option-logo";if(String(option.value||"").trim().toLowerCase()==="nano banana")img.classList.add("miya-nano-banana-option-logo");img.alt="";img.draggable=false;img.loading="eager";img.fetchPriority="high";img.decoding="async";img.src=modelLogoUrl(option.value);
    const label=document.createElement("span");label.className="miya-model-option-label";label.textContent=String(option.label||option.textContent||option.value);
    item.append(img,label);
   }else{item.textContent=String(option.label||option.textContent||option.value);}
   item.disabled=option.disabled;
   item.tabIndex=-1;
   item.addEventListener("mouseenter",()=>moveActive(index));
   item.addEventListener("mousedown",event=>{event.preventDefault();event.stopPropagation()});
   item.addEventListener("click",event=>{
    event.preventDefault();
    event.stopPropagation();
    chooseOption(option);
   });
   popup.appendChild(item);
  });
  select.setAttribute("aria-expanded","true");
  syncRatioTrigger(select);
  select.setAttribute("aria-controls",popup.id);
  popup.hidden=false;
  positionPopup(select);
  moveActive(activeIndex);
 }
 function togglePopup(select){
  if(activeSelect===select&&!popup.hidden)closePopup();
  else openPopup(select);
 }
 ids.forEach(id=>{
  const select=document.getElementById(id);
  if(!select||select.dataset.miyaCustomPopupBound)return;
  select.dataset.miyaCustomPopupBound="1";
  select.setAttribute("aria-haspopup","listbox");
  select.setAttribute("aria-expanded","false");
  if(select.id==="composerModel"){
   ensureModelTriggerLogo(select);
   select.addEventListener("change",()=>ensureModelTriggerLogo(select));
   new MutationObserver(()=>ensureModelTriggerLogo(select)).observe(select,{childList:true,subtree:true});
  }
  const onMouseDown=event=>{
   if(event.button!==0||!belongsToActiveSection(select))return;
   event.preventDefault();
   event.stopPropagation();
   try{select.focus({preventScroll:true})}catch{select.focus()}
   togglePopup(select);
  };
  select.addEventListener("mousedown",onMouseDown,true);
  // Mouse clicks are toggled on mousedown/pointerdown above. Do not reopen here:
  // the click event follows the same press and used to undo a just-closed popup.
  select.addEventListener("click",event=>{
   if(!belongsToActiveSection(select))return;
   event.preventDefault();
   event.stopPropagation();
  },true);
  select.addEventListener("pointerdown",event=>{
   if(event.pointerType==="mouse"||!belongsToActiveSection(select))return;
   event.preventDefault();
   event.stopPropagation();
   try{select.focus({preventScroll:true})}catch{select.focus()}
   togglePopup(select);
  },true);
  select.addEventListener("keydown",event=>{
   if(!belongsToActiveSection(select))return;
   if(event.key==="Escape"&&activeSelect===select&&!popup.hidden){
    event.preventDefault();event.stopPropagation();closePopup();return;
   }
   if(!["ArrowDown","ArrowUp","Enter"," ","F4"].includes(event.key))return;
   event.preventDefault();
   event.stopPropagation();
   if(popup.hidden||activeSelect!==select){
    const selected=availableOptions(select).findIndex(option=>option.value===select.value);
    const start=selected<0?0:selected;
    openPopup(select,event.key==="ArrowUp"?Math.max(0,start-1):start);
    return;
   }
   if(event.key==="ArrowDown")moveActive(activeIndex+1);
   else if(event.key==="ArrowUp")moveActive(activeIndex-1);
   else if(event.key==="Enter"||event.key===" "){
    const option=availableOptions(select)[activeIndex];
    chooseOption(option);
   }
  });
 });
 document.addEventListener("mousedown",event=>{
  if(popup.hidden)return;
  if(popup.contains(event.target)||event.target===activeSelect||event.target.closest("#themeToggle"))return;
  closePopup();
 },true);
 document.addEventListener("keydown",event=>{
  if(event.key==="Escape"&&!popup.hidden){event.preventDefault();closePopup()}
 });
 const reposition=()=>{if(!popup.hidden&&activeSelect)positionPopup(activeSelect)};
 window.addEventListener("resize",reposition,{passive:true});
 window.addEventListener("scroll",reposition,true);
})();
