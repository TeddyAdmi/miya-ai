 };
 const svgData=svg=>'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);
 const modelLogoUrl=value=>{const v=String(value||"").trim().toLowerCase();if(v.includes("nano banana"))return modelLogoData.banana;if(v.includes("agnes"))return svgData(modelLogoData.agnes);if(v.includes("kolors"))return svgData(modelLogoData.kolors);if(v.includes("qwen"))return svgData(modelLogoData.qwen);if(v.includes("flux"))return svgData(modelLogoData.flux);if(v==="imagesmith"||v.includes("gpt image"))return svgData(modelLogoData.openai);return "https://www.google.com/s2/favicons?domain="+encodeURIComponent(modelBrandDomain(value))+"&sz=64";};
 // Start every model-logo request together as early as possible, before a dropdown is opened.
 // Newly-added options are warmed too, so restored/dynamic model lists are covered.
 const preloadedModelLogoUrls=new Set();
 const preloadedModelLogoImages=new Map();
 const preloadModelLogo=value=>{
  const src=modelLogoUrl(value);
  if(!src||preloadedModelLogoUrls.has(src))return;
  preloadedModelLogoUrls.add(src);
  const preload=new Image();
  preload.fetchPriority="high";
  preload.loading="eager";
  preload.decoding="sync";
  preload.src=src;
  preloadedModelLogoImages.set(src,preload);
 };
 ids.filter(id=>id==="composerModel"||id==="videoModel").forEach(id=>{
  const select=document.getElementById(id);
  if(!select)return;
  const warmOptions=()=>availableOptions(select).forEach(option=>preloadModelLogo(option.value));
  warmOptions();
  new MutationObserver(warmOptions).observe(select,{childList:true,subtree:true});
 });
 function ensureModelTriggerLogo(select){
  if(!select||select.id!=="composerModel")return;
  let control=select.parentElement;
  if(!control||!control.classList.contains("areon-model-control")){
   control=document.createElement("span");control.className="areon-model-control";
   const oldLogo=select.previousElementSibling&&select.previousElementSibling.classList.contains("areon-model-logo")?select.previousElementSibling:null;
   select.parentNode.insertBefore(control,oldLogo||select);
   if(oldLogo)control.appendChild(oldLogo);
   control.appendChild(select);
  }
  let logo=control.querySelector(":scope > .areon-model-logo");
  if(!logo){
   logo=document.createElement("span");logo.className="areon-model-logo";logo.setAttribute("aria-hidden","true");
   control.insertBefore(logo,select);
  }
  let img=logo.querySelector("img");
  if(!img){img=document.createElement("img");img.alt="";img.draggable=false;img.loading="eager";img.fetchPriority="high";img.decoding="sync";logo.appendChild(img);}
  const src=modelLogoUrl(select.value);
  if(img.src!==src){
   const warmed=preloadedModelLogoImages.get(src);
   if(warmed&&warmed.complete&&warmed.naturalWidth){
    const replacement=warmed.cloneNode(false);
    replacement.alt="";
    replacement.draggable=false;
    replacement.loading="eager";
    replacement.fetchPriority="high";
    replacement.decoding="sync";
    logo.replaceChild(replacement,img);
    img=replacement;
   }else{
    img.decoding="sync";
    img.src=src;
   }
  }
 }

 function closePopup(){
  if(activeSelect){activeSelect.setAttribute("aria-expanded","false");syncRatioTrigger(activeSelect);}
  popup.hidden=true;
  popup.classList.remove("areon-music-scroll-popup");
  popup.replaceChildren();
  activeSelect=null;
  activeIndex=-1;
 }
 function moveActive(nextIndex){
  const items=Array.from(popup.querySelectorAll(".areon-composer-select-option:not(:disabled)"));
  if(!items.length)return;
  activeIndex=(nextIndex+items.length)%items.length;
  items.forEach((item,index)=>{
   const active=index===activeIndex;
   item.classList.toggle("is-active",active);
   item.setAttribute("aria-selected",String(activeSelect&&item.dataset.value===activeSelect.value));
  });
  const active=items[activeIndex];
  if(active){
   const r=active.getBoundingClientRect(),p=popup.getBoundingClientRect();
   if(r.bottom>p.bottom)popup.scrollTop+=r.bottom-p.bottom;
   else if(r.top<p.top)popup.scrollTop-=p.top-r.top;
  }
 }
 function chooseOption(option){
  const select=activeSelect;
  if(!select||!option||option.disabled)return;
  select.value=option.value;
  closePopup();
  select.focus({preventScroll:true});
  select.dispatchEvent(new Event("input",{bubbles:true}));
  select.dispatchEvent(new Event("change",{bubbles:true}));
 }
 function positionPopup(select){
  const selectRect=select.getBoundingClientRect();
  const control=select.id==="composerModel"&&select.parentElement&&select.parentElement.classList.contains("areon-model-control")?select.parentElement:null;
  const controlRect=control?control.getBoundingClientRect():null;
  const oldLogo=select.id==="composerModel"&&!control?select.previousElementSibling:null;
  const oldLogoRect=oldLogo&&oldLogo.classList.contains("areon-model-logo")?oldLogo.getBoundingClientRect():null;
  const musicSelect=select.id.startsWith("music");
  const left=controlRect?controlRect.left:(oldLogoRect?oldLogoRect.left:selectRect.left);
  let desiredWidth=Math.ceil(controlRect?controlRect.width:(selectRect.width+(oldLogoRect?oldLogoRect.width:0)));
  // Ratio menus keep the trigger width; model menus fit their full labels.
  const isRatioSelect=select.id==="composerRatio"||select.id==="videoRatio";
  const modelSelect=document.getElementById(select.id==="videoModel"?"videoModel":"composerModel")||document.getElementById("composerModel");
  if((select.id==="composerModel"||select.id==="videoModel")&&modelSelect){
   const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d");
   if(ctx){
    const style=getComputedStyle(modelSelect);
    ctx.font="700 "+(style.fontSize||"12px")+" "+(style.fontFamily||"Inter,system-ui,sans-serif");
    const longest=availableOptions(modelSelect).reduce((max,option)=>Math.max(max,ctx.measureText(String(option.label||option.textContent||option.value)).width),0);
    const modelControl=modelSelect.parentElement&&modelSelect.parentElement.classList.contains("areon-model-control")?modelSelect.parentElement:null;
    const logoWidth=modelControl&&modelControl.querySelector(".areon-model-logo")?modelControl.querySelector(".areon-model-logo").getBoundingClientRect().width:27;
    desiredWidth=Math.max(desiredWidth,Math.ceil(logoWidth+7.5+longest+28));
   }
  }
  if(musicSelect){
   // Each music menu gets an independent width based on its longest real option label.
   const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d");
   if(ctx){
    ctx.font="600 12px Inter,system-ui,sans-serif";
    const longest=availableOptions(select).reduce((max,option)=>Math.max(max,ctx.measureText(String(option.label||option.textContent||option.value)).width),0);
    desiredWidth=Math.max(desiredWidth,Math.ceil(longest+44));
   }
  }
  const width=Math.max(1,Math.min(desiredWidth,window.innerWidth-16));
  popup.style.width=width+"px";
  const popupLeft=Math.max(8,Math.min(left,window.innerWidth-width-8));
  popup.style.left=popupLeft+"px";
  const desiredHeight=popup.scrollHeight;
  const popupAnchor=controlRect||oldLogoRect||selectRect;
  if(musicSelect){
   // Show at most ten 36px rows and anchor the list above its field; the rest scrolls.
   const tenRowsHeight=10*36+8;
   const availableAbove=Math.max(80,selectRect.top-12);
   const visibleHeight=Math.min(desiredHeight,tenRowsHeight,availableAbove,window.innerHeight-16);
   popup.style.maxHeight=Math.max(80,visibleHeight)+"px";
   const popupHeight=Math.min(desiredHeight,tenRowsHeight,availableAbove,window.innerHeight-16);
   popup.style.top=Math.max(8,selectRect.top-popupHeight-4)+"px";
   return;
  }
  popup.style.maxHeight=Math.max(80,Math.min(desiredHeight,window.innerHeight-16))+"px";
  const popupHeight=Math.min(desiredHeight,window.innerHeight-16);
  const below=window.innerHeight-popupAnchor.bottom-8;
  const above=popupAnchor.top-8;
  let top;
  if(below<Math.min(popupHeight,180)&&above>below)top=Math.max(8,popupAnchor.top-popupHeight-4);
  else top=Math.min(window.innerHeight-popupHeight-8,popupAnchor.bottom+4);
  popup.style.top=Math.max(8,top)+"px";
 }
 function openPopup(select,initialIndex){
  if(!select||!belongsToActiveSection(select))return;
  if(activeSelect&&activeSelect!==select)activeSelect.setAttribute("aria-expanded","false");
  activeSelect=select;
  popup.classList.toggle("areon-music-scroll-popup",["musicOccasion","musicRecipient","musicGenre"].includes(select.id));
  const options=availableOptions(select);
  popup.replaceChildren();
  activeIndex=Number.isInteger(initialIndex)?initialIndex:options.findIndex(option=>option.value===select.value);
  if(activeIndex<0)activeIndex=0;
  options.forEach((option,index)=>{
   const item=document.createElement("button");
   item.type="button";
   item.className="areon-composer-select-option";
   item.setAttribute("role","option");
   item.setAttribute("aria-selected",String(option.value===select.value));
   item.dataset.value=option.value;
   item.dataset.index=String(index);
   if((select.id==="composerRatio"||select.id==="videoRatio")&&(ratioValues.has(option.value)||option.value==="auto")){item.classList.add("areon-ratio-option");const label=document.createElement("span");label.className="areon-ratio-label";label.textContent=option.value;const icon=document.createElement("span");icon.className="areon-ratio-icon";if(ratioValues.has(option.value))icon.innerHTML=ratioSvg(option.value);item.append(label,icon);item.setAttribute("aria-label",option.value);}else if(select.id==="composerModel"){
    item.classList.add("areon-model-option");
    const tile=document.createElement("span");tile.className="areon-model-option-logo-tile";tile.setAttribute("aria-hidden","true");
    const img=document.createElement("img");img.className="areon-model-option-logo";img.alt="";img.draggable=false;img.loading="eager";img.fetchPriority="high";img.decoding="sync";img.src=modelLogoUrl(option.value);
    const label=document.createElement("span");label.className="areon-model-option-label";label.textContent=String(option.label||option.textContent||option.value);
    tile.appendChild(img);item.append(tile,label);
   }else{item.textContent=String(option.label||option.textContent||option.value);}
   item.disabled=option.disabled;
   item.tabIndex=-1;
   item.addEventListener("mouseenter",()=>moveActive(index));
   item.addEventListener("mousedown",event=>{event.preventDefault();event.stopPropagation()});
   item.addEventListener("click",event=>{
    event.preventDefault();
    event.stopPropagation();
    chooseOption(option);
   });
   popup.appendChild(item);
  });
  select.setAttribute("aria-expanded","true");
  syncRatioTrigger(select);
  select.setAttribute("aria-controls",popup.id);
  popup.hidden=false;
  positionPopup(select);
  moveActive(activeIndex);
 }
 function togglePopup(select){
  if(activeSelect===select&&!popup.hidden)closePopup();
  else openPopup(select);
 }
 const bindSelect=select=>{
  if(!select||!ids.includes(select.id)||select.dataset.areonCustomPopupBound)return;
  select.dataset.areonCustomPopupBound="1";
  select.setAttribute("aria-haspopup","listbox");
  select.setAttribute("aria-expanded","false");
  if(select.id==="composerModel"){
   ensureModelTriggerLogo(select);
   select.addEventListener("change",()=>ensureModelTriggerLogo(select));
   new MutationObserver(()=>ensureModelTriggerLogo(select)).observe(select,{childList:true,subtree:true});
  }
  const onMouseDown=event=>{
   if(event.button!==0||!belongsToActiveSection(select))return;
   event.preventDefault();
   event.stopPropagation();
   try{select.focus({preventScroll:true})}catch{select.focus()}
   togglePopup(select);
  };
  select.addEventListener("mousedown",onMouseDown,true);
  select.addEventListener("click",event=>{
   if(!belongsToActiveSection(select))return;
   event.preventDefault();
   event.stopPropagation();
  },true);
  select.addEventListener("pointerdown",event=>{
   if(event.pointerType==="mouse"||!belongsToActiveSection(select))return;
   event.preventDefault();
   event.stopPropagation();
   try{select.focus({preventScroll:true})}catch{select.focus()}
   togglePopup(select);
  },true);
  select.addEventListener("keydown",event=>{
   if(!belongsToActiveSection(select))return;
   if(event.key==="Escape"&&activeSelect===select&&!popup.hidden){
    event.preventDefault();event.stopPropagation();closePopup();return;
   }
   if(!["ArrowDown","ArrowUp","Enter"," ","F4"].includes(event.key))return;
   event.preventDefault();
   event.stopPropagation();
   if(popup.hidden||activeSelect!==select){
    const selected=availableOptions(select).findIndex(option=>option.value===select.value);
    const start=selected<0?0:selected;
    openPopup(select,event.key==="ArrowUp"?Math.max(0,start-1):start);
    return;
   }
   if(event.key==="ArrowDown")moveActive(activeIndex+1);
   else if(event.key==="ArrowUp")moveActive(activeIndex-1);
   else if(event.key==="Enter"||event.key===" "){
    const option=availableOptions(select)[activeIndex];
    chooseOption(option);
   }
  });
 };
 ids.forEach(id=>bindSelect(document.getElementById(id)));
 // Music option selects are inserted by the module script after this inline script.
 // Bind them as soon as their container is attached to the document.
 const selectBinder=new MutationObserver(records=>{
  for(const record of records){
   for(const node of record.addedNodes){
    if(node.nodeType!==1)continue;
    if(node.matches?.("select"))bindSelect(node);
    node.querySelectorAll?.("select").forEach(bindSelect);
   }
  }
 });
 selectBinder.observe(document.body,{childList:true,subtree:true});
 document.addEventListener("mousedown",event=>{
  if(popup.hidden)return;
  if(popup.contains(event.target)||event.target===activeSelect||event.target.closest("#themeToggle"))return;
  closePopup();
 },true);
 document.addEventListener("keydown",event=>{
  if(event.key==="Escape"&&!popup.hidden){event.preventDefault();closePopup()}
 });
 const reposition=()=>{if(!popup.hidden&&activeSelect)positionPopup(activeSelect)};
 window.addEventListener("resize",reposition,{passive:true});
 window.addEventListener("scroll",reposition,true);
})();
